name: Run R Pipeline + Deploy Shiny

on:
  push:
    branches: [main]

  schedule:
    # Runs daily at 7 AM UTC
    - cron: '0 14 * * 1-5'

  workflow_dispatch:  # optional manual trigger

permissions:
   contents: read

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install & cache R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
           packages: |
              any::rsconnect
              any::shiny
              any::tidyverse
              any::plotly
              any::leaflet
              any::bsicons
              any::gt
              any::bslib
              any::lubridate
              any::readr
              any::forcats
              any::httr2
              any::jsonlite
              any::purrr
              any::xml2
              github::bcgov/envreportutils

      - name: Run data pipeline scripts
        env:
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          Rscript 01_field-visit.R
          Rscript 02_timeseries.R
          Rscript 03_telemetry.R

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          GITHUB_PAT: ${{ secrets.GH_TOKEN }}
        run: |
          Rscript -e '
            library(rsconnect);

            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINYAPPS_NAME"),
              token = Sys.getenv("SHINYAPPS_TOKEN"),
              secret = Sys.getenv("SHINYAPPS_SECRET")
            );

            rsconnect::deployApp(appDir = "app", appName = "weekly-hydrometric-app)
          '
